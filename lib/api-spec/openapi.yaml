openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Tawqeet foundation API
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /auth/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Current session (public; user is null when signed out)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
  /auth/magic-link:
    post:
      operationId: requestMagicLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagicLinkInput" }
      responses:
        "200":
          description: Link requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /auth/verify:
    post:
      operationId: verifyMagicLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkVerificationInput" }
      responses:
        "200":
          description: One-time link consumed and HttpOnly session cookie set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /agency:
    get:
      operationId: getAgency
      responses:
        "200":
          description: Signed-in agency
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agency" }
    patch:
      operationId: updateAgency
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgencyInput" }
      responses:
        "200":
          description: Agency saved (owner only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agency" }
  /clients:
    get:
      operationId: listClients
      responses:
        "200":
          description: Agency clients
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Client" }
    post:
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
  /clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getClient
      responses:
        "200":
          description: Client details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
    patch:
      operationId: updateClient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "200":
          description: Client saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
    delete:
      operationId: deleteClient
      responses:
        "200":
          description: Client deleted (owner only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /settings/system:
    get:
      operationId: getSystemCheck
      responses:
        "200":
          description: Configuration checks (owner only, never returns secrets)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemCheck" }
  /clients/{id}/brain:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getBrain
      responses:
        "200":
          description: Client knowledge and sources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrainResponse" }
    patch:
      operationId: saveBrainProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrainProfileInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrainResponse" }
  /clients/{id}/brain/crawl:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: crawlBrainWebsite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrainUrlInput" }
      responses:
        "200":
          description: Extracted and saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrainImportResult" }
  /clients/{id}/brain/case-studies:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: createBrainCaseStudy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseStudyInput" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrainCaseStudy" }
  /clients/{id}/brain/case-studies/{caseId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateBrainCaseStudy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseStudyInput" }
      responses:
        "200":
          description: Saved and approval updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrainCaseStudy" }
  /clients/{id}/brain/case-studies/extract:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: extractBrainCaseStudies
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseExtractionInput" }
      responses:
        "200":
          description: Extracted as unapproved drafts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrainImportResult" }
  /clients/{id}/brain/uploads:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: requestBrainUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrainUploadInput" }
      responses:
        "200":
          description: Private signed upload URL
          content:
            application/json:
              schema:
                type: object
                required: [uploadUrl, objectPath]
                properties:
                  uploadUrl: { type: string }
                  objectPath: { type: string }
  /clients/{id}/brain/crm/csv:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: importBrainCsv
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrainCsvInput" }
      responses:
        "200":
          description: CRM records imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrainImportResult" }
  /clients/{id}/brain/crm/hubspot:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: importBrainHubspot
      responses:
        "200":
          description: Companies and closed-won deals imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrainImportResult" }
  /clients/{id}/brain/learnings:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: vertical, in: query, schema: { type: string, maxLength: 200 } }
    get:
      operationId: getBrainLearnings
      responses:
        "200":
          description: Most recent 50 reply learnings
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/BrainEntry" } }
  /settings/signals:
    get:
      operationId: listSignalDefinitions
      tags: [signals]
      responses:
        "200":
          description: Signal catalogue
          content:
            application/json:
              schema:
                type: object
                required: [count, definitions]
                properties:
                  count: { type: integer }
                  definitions:
                    type: array
                    items: { $ref: "#/components/schemas/SignalDefinition" }
  /settings/signals/{key}:
    patch:
      operationId: updateSignalDefinition
      tags: [signals]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignalDefinitionInput" }
      responses:
        "200":
          description: Definition saved and lead scores recalculated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignalDefinition" }
  /leads/signals:
    get:
      operationId: listSignalLeads
      tags: [signals]
      responses:
        "200":
          description: Tenant leads and their evidence
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SignalLead" }
  /demo/status:
    get:
      operationId: getDemoStatus
      responses:
        "200":
          description: Demo mode and background progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoStatus" }
  /demo/login:
    post:
      operationId: demoLogin
      responses:
        "200":
          description: Demo session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /demo/load:
    post:
      operationId: loadDemoData
      responses:
        "202":
          description: Loading demo data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /demo/radar:
    get:
      operationId: getDemoRadar
      responses:
        "200":
          description: Radar companies and scored leads
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoRadar" }
  /demo/radar/run:
    post:
      operationId: runDemoRadar
      responses:
        "202":
          description: Radar started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /demo/signals:
    post:
      operationId: addDemoSignal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId, url]
              properties:
                companyId: { type: string }
                url: { type: string, format: uri }
      responses:
        "202":
          description: Reading source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /demo/leads/{id}:
    get:
      operationId: getDemoLead
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Lead, evidence and drafts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoLead" }
  /demo/leads/{id}/drafts:
    post:
      operationId: generateDemoDrafts
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Draft generation started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /demo/drafts/{id}/simulate:
    post:
      operationId: simulateDemoDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Simulation started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /demo/drafts/{id}/rewrite:
    post:
      operationId: rewriteDemoDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Rewrite and re-score started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /review/queue:
    get:
      operationId: getReviewQueue
      responses:
        "200":
          description: Ready and sent emails across demo leads
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewQueue" }
  /review/drafts/{id}/send:
    post:
      operationId: approveAndSendDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendDraftInput" }
      responses:
        "200":
          description: Sent to the demo recipient
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendResult" }
  /review/sends/{id}/reply:
    post:
      operationId: markSendReply
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplyInput" }
      responses:
        "200":
          description: Reply recorded and learning written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /settings/alerts:
    get:
      operationId: getAlertSettings
      responses:
        "200":
          description: Alert channels and log
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertSettings" }
  /settings/alerts/test:
    post:
      operationId: sendTestAlert
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestAlertInput" }
      responses:
        "200":
          description: Test alert attempted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /settings/billing:
    get:
      operationId: getBilling
      responses:
        "200":
          description: Plan and usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Billing" }
  /settings/compliance:
    get:
      operationId: getCompliance
      responses:
        "200":
          description: Rules, suppression list and audit log
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Compliance" }
  /settings/compliance/suppression:
    post:
      operationId: addSuppression
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuppressionInput" }
      responses:
        "200":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /settings/compliance/suppression/{id}:
    delete:
      operationId: removeSuppression
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /settings/compliance/check:
    post:
      operationId: checkRecipient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipientCheckInput" }
      responses:
        "200":
          description: Whether the address may be contacted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipientCheck" }
  /reports:
    get:
      operationId: getReport
      parameters:
        - { name: clientId, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Client report and calibration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
  /public/landing:
    get:
      operationId: getLandingInfo
      responses:
        "200":
          description: Public landing configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LandingInfo" }
  /settings/alerts/digest:
    post:
      operationId: sendDigestNow
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DigestInput" }
      responses:
        "200":
          description: Digest attempted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /review/clients/{id}/resume:
    post:
      operationId: resumeClientSending
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Sending resumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /contacts/{id}/export:
    get:
      operationId: exportContactData
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: All stored data for this contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactExport" }
  /contacts/{id}:
    delete:
      operationId: deleteContact
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Contact deleted, anonymised audit kept
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /reports/share:
    post:
      operationId: createReportShareLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareLinkInput" }
      responses:
        "200":
          description: Read-only client link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareLink" }
  /share/login:
    post:
      operationId: shareLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareLoginInput" }
      responses:
        "200":
          description: Client viewer session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /settings/ab:
    patch:
      operationId: updateAbTest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AbTestInput" }
      responses:
        "200":
          description: A/B setting updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /plays:
    get:
      operationId: listPlays
      responses:
        "200":
          description: Plays and signals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayLibrary" }
    post:
      operationId: createPlay
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayInput" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Play" }
  /plays/{id}:
    patch:
      operationId: updatePlay
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Play" }
  /settings/system/live:
    get:
      operationId: getLiveServiceChecks
      responses:
        "200":
          description: Live minimal calls to each configured service (no values returned)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveChecks" }
components:
  schemas:
    DemoStatus:
      type: object
      required: [enabled, loaded, running, stage, warnings, error, geminiConfigured]
      properties:
        enabled: { type: boolean }
        loaded: { type: boolean }
        running: { type: boolean }
        stage: { type: string }
        warnings: { type: array, items: { type: string } }
        error: { type: string, nullable: true }
        geminiConfigured: { type: boolean }
    InboxSimulation:
      type: object
      required: [personas, gmailSummary, applePreview, spamScore, spamFlags, score, mode, gmailModel, notes]
      properties:
        personas:
          type: array
          items:
            type: object
            required: [name, verdict, reason]
            properties:
              name: { type: string }
              verdict: { type: string }
              reason: { type: string }
        gmailSummary: { type: string }
        applePreview: { type: string }
        spamScore: { type: integer }
        spamFlags: { type: array, items: { type: string } }
        score: { type: integer }
        mode: { type: string, enum: [ai, sample] }
        gmailModel: { type: string }
        notes: { type: array, items: { type: string } }
    DemoDraft:
      type: object
      required: [id, variant, subject, body, language, score, simulation, model]
      properties:
        id: { type: string }
        variant: { type: integer }
        subject: { type: string }
        body: { type: string }
        language: { type: string }
        score: { type: integer, nullable: true }
        simulation:
          allOf: [{ $ref: "#/components/schemas/InboxSimulation" }]
          nullable: true
        model: { type: string }
    DemoLead:
      type: object
      required: [id, fullName, title, companyName, country, clientId, temperature, totalScore, signalPoints, stackingBonus, sample, language, legalBasis, signals, drafts]
      properties:
        legalBasis: { type: string }
        id: { type: string }
        fullName: { type: string }
        title: { type: string }
        companyName: { type: string }
        country: { type: string }
        clientId: { type: string }
        temperature: { type: string, enum: [hot, warm, cold] }
        totalScore: { type: integer }
        signalPoints: { type: number }
        stackingBonus: { type: number }
        sample: { type: boolean }
        language: { type: string }
        signals:
          type: array
          items: { $ref: "#/components/schemas/DemoEvidence" }
        drafts:
          type: array
          items: { $ref: "#/components/schemas/DemoDraft" }
    DemoEvidence:
      type: object
      required: [id, name, title, evidenceQuote, url, detectedAt, points]
      properties:
        id: { type: string }
        name: { type: string }
        title: { type: string }
        evidenceQuote: { type: string }
        url: { type: string, nullable: true }
        detectedAt: { type: string }
        points: { type: number }
    DemoRadar:
      type: object
      required: [leads, companies]
      properties:
        leads:
          type: array
          items: { $ref: "#/components/schemas/DemoLead" }
        companies:
          type: array
          items:
            type: object
            required: [id, name, country, atsProvider, atsSlug, roleCount, lastCheckedAt, error]
            properties:
              id: { type: string }
              name: { type: string }
              country: { type: string }
              atsProvider: { type: string, nullable: true }
              atsSlug: { type: string, nullable: true }
              roleCount: { type: integer }
              lastCheckedAt: { type: string, nullable: true }
              error: { type: string, nullable: true }
    SignalDefinitionInput:
      type: object
      required: [baseWeight, halfLifeDays, verticalMultipliers, keywordsEn, keywordsAr, active]
      properties:
        baseWeight: { type: integer, minimum: -40, maximum: 40 }
        halfLifeDays: { type: integer, minimum: 1, maximum: 3650 }
        verticalMultipliers:
          type: object
          required: [saas, re, hr]
          properties:
            saas: { type: number, minimum: 0, maximum: 10 }
            re: { type: number, minimum: 0, maximum: 10 }
            hr: { type: number, minimum: 0, maximum: 10 }
        keywordsEn: { type: array, maxItems: 100, items: { type: string, maxLength: 200 } }
        keywordsAr: { type: array, maxItems: 100, items: { type: string, maxLength: 200 } }
        active: { type: boolean }
    SignalDefinition:
      allOf:
        - { $ref: "#/components/schemas/SignalDefinitionInput" }
        - type: object
          required: [id, key, name, description, sourceTypes, targetPersonas, exclusions, playHint, isNegative, scope]
          properties:
            id: { type: string }
            key: { type: string }
            name: { type: string }
            description: { type: string }
            sourceTypes: { type: array, items: { type: string } }
            targetPersonas: { type: array, items: { type: string } }
            exclusions: { type: array, items: { type: string } }
            playHint: { type: string }
