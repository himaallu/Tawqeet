openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Tawqeet foundation API
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /auth/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Current session (public; user is null when signed out)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
  /auth/magic-link:
    post:
      operationId: requestMagicLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagicLinkInput" }
      responses:
        "200":
          description: Link requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /auth/verify:
    post:
      operationId: verifyMagicLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkVerificationInput" }
      responses:
        "200":
          description: One-time link consumed and HttpOnly session cookie set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /agency:
    get:
      operationId: getAgency
      responses:
        "200":
          description: Signed-in agency
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agency" }
    patch:
      operationId: updateAgency
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgencyInput" }
      responses:
        "200":
          description: Agency saved (owner only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agency" }
  /clients:
    get:
      operationId: listClients
      responses:
        "200":
          description: Agency clients
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Client" }
    post:
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
  /clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getClient
      responses:
        "200":
          description: Client details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
    patch:
      operationId: updateClient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "200":
          description: Client saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
    delete:
      operationId: deleteClient
      responses:
        "200":
          description: Client deleted (owner only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /settings/system:
    get:
      operationId: getSystemCheck
      responses:
        "200":
          description: Configuration checks (owner only, never returns secrets)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemCheck" }
  /clients/{id}/brain:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getBrain
      responses:
        "200":
          description: Client knowledge and sources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrainResponse" }
    patch:
      operationId: saveBrainProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrainProfileInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrainResponse" }
  /clients/{id}/brain/crawl:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: crawlBrainWebsite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrainUrlInput" }
      responses:
        "200":
          description: Extracted and saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrainImportResult" }
  /clients/{id}/brain/case-studies:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: createBrainCaseStudy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseStudyInput" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrainCaseStudy" }
  /clients/{id}/brain/case-studies/{caseId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateBrainCaseStudy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseStudyInput" }
      responses:
        "200":
          description: Saved and approval updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrainCaseStudy" }
  /clients/{id}/brain/case-studies/extract:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: extractBrainCaseStudies
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseExtractionInput" }
      responses:
        "200":
          description: Extracted as unapproved drafts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrainImportResult" }
  /clients/{id}/brain/uploads:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: requestBrainUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrainUploadInput" }
      responses:
        "200":
          description: Private signed upload URL
          content:
            application/json:
              schema:
                type: object
                required: [uploadUrl, objectPath]
                properties:
                  uploadUrl: { type: string }
                  objectPath: { type: string }
  /clients/{id}/brain/crm/csv:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: importBrainCsv
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrainCsvInput" }
      responses:
        "200":
          description: CRM records imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrainImportResult" }
  /clients/{id}/brain/crm/hubspot:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: importBrainHubspot
      responses:
        "200":
          description: Companies and closed-won deals imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrainImportResult" }
  /clients/{id}/brain/learnings:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: vertical, in: query, schema: { type: string, maxLength: 200 } }
    get:
      operationId: getBrainLearnings
      responses:
        "200":
          description: Most recent 50 reply learnings
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/BrainEntry" } }
components:
  schemas:
    BrainProfileInput:
      type: object
      required: [offer, whoYouSellTo, dealSize, topPains, proofPoints, wordsToNeverUse, languages, tone, differentiators, noGoClaims]
      properties:
        offer: { type: string, maxLength: 10000 }
        whoYouSellTo: { type: string, maxLength: 10000 }
        dealSize: { type: string, maxLength: 500 }
        topPains: { type: array, maxItems: 3, items: { type: string, maxLength: 2000 } }
        proofPoints: { type: array, maxItems: 100, items: { type: string, maxLength: 2000 } }
        wordsToNeverUse: { type: array, maxItems: 100, items: { type: string, maxLength: 500 } }
        languages: { type: array, minItems: 1, maxItems: 2, items: { type: string, enum: [en, ar] } }
        tone: { type: string, maxLength: 2000 }
        differentiators: { type: array, maxItems: 100, items: { type: string, maxLength: 2000 } }
        noGoClaims: { type: array, maxItems: 100, items: { type: string, maxLength: 2000 } }
    BrainCaseStudy:
      allOf:
        - { $ref: "#/components/schemas/CaseStudyInput" }
        - type: object
          required: [id, source, sourceRef, createdAt]
          properties:
            id: { type: string }
            source: { type: string, enum: [upload, url, form, website] }
            sourceRef: { type: [string, "null"] }
            createdAt: { type: string }
    CaseStudyInput:
      type: object
      required: [customerName, customerVertical, customerCountry, customerSizeBand, problem, solution, resultMetric, resultValue, timeframe, quote, quotePersonTitle, canNameCustomer, language, approved]
      properties:
        customerName: { type: string, maxLength: 500 }
        customerVertical: { type: string, maxLength: 500 }
        customerCountry: { type: string, maxLength: 500 }
        customerSizeBand: { type: string, maxLength: 500 }
        problem: { type: string, minLength: 1, maxLength: 10000 }
        solution: { type: string, minLength: 1, maxLength: 10000 }
        resultMetric: { type: string, maxLength: 2000 }
        resultValue: { type: string, maxLength: 2000 }
        timeframe: { type: string, maxLength: 500 }
        quote: { type: string, maxLength: 10000 }
        quotePersonTitle: { type: string, maxLength: 500 }
        canNameCustomer: { type: boolean }
        language: { type: string, enum: [en, ar] }
        approved: { type: boolean }
    BrainEntry:
      type: object
      required: [id, kind, content, meta, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [website, form, crm, learning] }
        content: { type: string }
        meta: { type: object, additionalProperties: {} }
        createdAt: { type: string }
    BrainResponse:
      type: object
      required: [profile, entries, caseStudies, learnings, status]
      properties:
        profile: { $ref: "#/components/schemas/BrainProfileInput" }
        entries: { type: array, items: { $ref: "#/components/schemas/BrainEntry" } }
        caseStudies: { type: array, items: { $ref: "#/components/schemas/BrainCaseStudy" } }
        learnings: { type: array, items: { $ref: "#/components/schemas/BrainEntry" } }
        status:
          type: object
          required: [aiConfigured, aiMessage, hubspotConfigured, storageConfigured]
          properties:
            aiConfigured: { type: boolean }
            aiMessage: { type: string }
            hubspotConfigured: { type: boolean }
            storageConfigured: { type: boolean }
    BrainUrlInput:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri, maxLength: 2000 }
    CaseExtractionInput:
      type: object
      properties:
        url: { type: string, maxLength: 2000 }
        objectPath: { type: string, maxLength: 2000 }
    BrainUploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 250 }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        contentType: { type: string, maxLength: 200 }
    BrainCsvInput:
      type: object
      required: [csv, kind]
      properties:
        csv: { type: string, minLength: 1, maxLength: 1000000 }
        kind: { type: string, enum: [contacts, won_deals] }
    BrainImportResult:
      type: object
      required: [message, imported, skipped, warnings]
      properties:
        message: { type: string }
        imported: { type: integer }
        skipped: { type: integer }
        warnings: { type: array, items: { type: string } }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    MagicLinkInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    LinkVerificationInput:
      type: object
      required: [token]
      properties:
        token: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    User:
      type: object
      required: [id, agencyId, email, role]
      properties:
        id: { type: string }
        agencyId: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, member, client_viewer] }
    SessionInfo:
      type: object
      required: [user, loginConfigured]
      properties:
        user:
          anyOf:
            - { $ref: "#/components/schemas/User" }
            - { type: "null" }
        loginConfigured: { type: boolean }
    Agency:
      type: object
      required: [id, name, plan, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        plan: { type: string }
        createdAt: { type: string }
    AgencyInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    ClientInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        website: { type: string, maxLength: 2048 }
        verticals: { type: array, items: { type: string } }
        regions: { type: array, items: { type: string } }
        languages: { type: array, items: { type: string } }
        offer: { type: string, maxLength: 10000 }
        icp: { type: object, additionalProperties: true }
        tone: { type: string, maxLength: 1000 }
        noGoClaims: { type: array, items: { type: string } }
    Client:
      type: object
      required: [id, agencyId, name, website, verticals, regions, languages, offer, icp, tone, noGoClaims, createdAt]
      properties:
        id: { type: string }
        agencyId: { type: string }
        name: { type: string }
        website: { type: string }
        verticals: { type: array, items: { type: string } }
        regions: { type: array, items: { type: string } }
        languages: { type: array, items: { type: string } }
        offer: { type: string }
        icp: { type: object, additionalProperties: true }
        tone: { type: string }
        noGoClaims: { type: array, items: { type: string } }
        createdAt: { type: string }
    SystemCheck:
      type: object
      required: [checkedAt, checks]
      properties:
        checkedAt: { type: string }
        checks:
          type: array
          items: { $ref: "#/components/schemas/ConfigCheck" }
    ConfigCheck:
      type: object
      required: [key, label, category, ok, required, detail]
      properties:
        key: { type: string }
        label: { type: string }
        category: { type: string, enum: [core, email, ai, optional] }
        ok: { type: boolean }
        required: { type: boolean }
        detail: { type: string }
